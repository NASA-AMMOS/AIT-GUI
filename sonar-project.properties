# SonarQube Cloud configuration for AIT-GUI
#
# Set up per the AMMOS scanning guide:
#   https://wiki.jpl.nasa.gov/display/AmmosArch/Code+Vulnerability+Scanning+Set+Up+for+AMMOS+Open+Source+Software
#
# NOTE: confirm projectKey against the value shown under Information on the
# project's SonarQube Cloud Overview page before the first run --
# https://sonarcloud.io/organizations/nasa-ammos/projects
sonar.projectKey=NASA-AMMOS_AIT-GUI
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from pyproject.toml by the
# Security-Scan workflow, so the value here is only a fallback for a scan run
# outside that workflow.
sonar.projectName=AIT-GUI
sonar.projectVersion=2.5.2
sonar.projectDescription=AMMOS Instrument Toolkit (AIT) GUI - browser-based user interface for AIT command, telemetry and sequencing.

# Project links - shown in the SonarQube Cloud UI
sonar.links.homepage=https://ait-gui.readthedocs.io/en/latest
sonar.links.scm=https://github.com/NASA-AMMOS/AIT-GUI
sonar.links.issue=https://github.com/NASA-AMMOS/AIT-GUI/issues
sonar.links.ci=https://github.com/NASA-AMMOS/AIT-GUI/actions

# ==========================================
# Analysis scope
# ==========================================
# Our own code only:
#   ait/        both halves of the application. ait/gui/__init__.py is the
#               bottle server -- the command, telemetry, sequence, script and
#               file endpoints over HTTP and websockets, which is where the
#               server-side attack surface lives. ait/gui/static/js is the
#               Mithril front end that renders telemetry into the DOM, and
#               ait/gui/openmct_adapter is the OpenMCT integration JavaScript.
#   .github/    workflow definitions, so the CodeQL `actions` findings have
#               source files to attach to, and the SARIF import can map them.
#
# Deliberately not listed:
#   doc/        -- Sphinx .rst pages and a conf.py that is not shipped.
#   tests/      -- excluded rather than declared via sonar.tests; no coverage
#       report is published today, so indexing it would only add LOC.
#
# Keep this in step with .github/codeql/codeql-config.yml: SonarQube can only
# attach an imported CodeQL finding to a file that is inside its own analysis
# scope, so anything CodeQL scans must be a source here too.
sonar.sources=ait,.github

# Exclusions. These are the only lever that keeps a path out of analysis --
# sonar.test.exclusions is deliberately not used, because it filters the file
# set named by sonar.tests, and sonar.tests is unset here (see above).
#
# ait/gui/static/build/ait.bundle.js is the webpack output: the same front-end
# source as ait/gui/static/js, concatenated with its npm dependencies. Leaving
# it in would double-count every line and every finding in js/, and pull a
# large body of vendored library code into the project's LOC.
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.tox/**,\
  **/.venv/**,\
  **/dist/**,\
  **/*.egg-info/**,\
  ait/gui/static/build/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/package-lock.json,\
  ait/gui/static/css/**,\
  ait/gui/static/fonts/**,\
  **/*.svg,\
  **/*.png,\
  tests/**,\
  ait/gui/static/test/**

# Coverage exclusions - no coverage report is published today, but these
# should never count against it when one is.
sonar.coverage.exclusions=\
  tests/**,\
  ait/gui/static/test/**,\
  ait/gui/bin/**,\
  ait/gui/static/webpack.config.js,\
  .github/**

# Duplication exclusions - generated and vendored code is not ours to
# de-duplicate.
sonar.cpd.exclusions=\
  ait/gui/static/build/**,\
  **/*.min.js

# Language settings. AIT-GUI supports Python >= 3.10 < 3.12 (pyproject.toml).
# The front end is ES6 authored as .js and bundled by webpack.
sonar.python.version=3.10,3.11
sonar.javascript.file.suffixes=.js,.mjs
sonar.sourceEncoding=UTF-8

sonar.tags=nasa,ammos,ait,ground-data-system,telemetry,gui,python,javascript

# New Code: anything added in the last 30 days counts as new.
sonar.leak.period=30

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
